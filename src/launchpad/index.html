<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Lazurio — Profile</title></head>
<body>
<main>
<h1>Lazurio — Profile</h1>
<p id="notice">Development fixture only. No software installation or migration.</p>
<form id="profile">
<fieldset disabled id="choices">
<legend id="legend">Machine profile</legend>
<p><label>Access <select name="access"><option value="local">Local</option><option value="remote">Remote</option></select></label></p>
<p><label>Purpose <select name="purpose"><option value="human">Human</option><option value="buddy">Buddy</option><option value="ai_colleague">AI colleague</option></select></label></p>
<p><label>Language <select name="locale"><option value="en">English</option><option value="cs">Čeština</option></select></label></p>
<p><label>Detail <select name="detail"><option value="concise">Concise</option><option value="technical">Technical</option></select></label></p>
<p><label>Coordination <select name="coordination"><option value="direct">Direct</option><option value="coordinator">Coordinator</option></select></label></p>
<button type="submit">Preview</button>
<button type="button" id="reload">Reload profile</button>
<button type="button" id="apply" disabled>Apply previewed change</button>
</fieldset>
</form>
<p id="status" role="status">Loading…</p>
<pre id="result"></pre>
</main>
<script type="module" src="./ui.ts"></script>
</body>
</html>
