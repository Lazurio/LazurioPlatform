<style>
/* Nová karta (decision F47, the approved wireframe prototypes-lazurio #27:
   NewTab.tsx and browser-panel.css), what "+" opens in the right panel of
   every app of the Environment: the address bar, the app's tools, Přehled
   and Navrhované, one calm column. Every colour comes from the design
   system's tokens, and from the app's colour roles (`--lazurio-*`) when the
   element hands them over, so Nová karta looks like the app around it. Three
   radii (fields and keys, controls, free-standing objects) and the one
   shadow for what floats over the page. Plain CSS, no framework. */
:root {
  color-scheme: light;
  --nt-surface: var(--lazurio-surface, var(--lz-white));
  --nt-ink: var(--lazurio-ink, var(--lz-ink));
  --nt-muted: var(--lazurio-ink-muted, var(--lz-ink-muted));
  --nt-faint: var(--lazurio-ink-muted, var(--lz-ink-faint));
  --nt-line: var(--lazurio-line, var(--lz-line));
  --nt-line-faint: var(--lazurio-line, var(--lz-line-faint));
  --nt-line-strong: var(--lazurio-line-strong, var(--lz-gray-300));
  --nt-hover: var(--lazurio-hover, var(--lz-gray-50));
  --nt-control: var(--lazurio-control, var(--lz-gray-25));
  --nt-raised: var(--lazurio-raised, var(--lz-white));
  --nt-selected: var(--lazurio-selected, var(--lz-gray-50));
  --nt-overlay: var(--lazurio-overlay, var(--lz-white));
  --nt-overlay-ink: var(--lazurio-overlay-ink, var(--lz-ink));
  --nt-focus: var(--lazurio-focus, var(--lz-accent));
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--nt-surface); color: var(--nt-ink); font: 14px/1.45 var(--lz-font-sans); letter-spacing: var(--lz-track-body); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, a { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--nt-focus); outline-offset: 1px; }
.icon { width: 16px; height: 16px; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.nt { display: grid; align-content: start; gap: 24px; max-width: 760px; margin: 0 auto; padding: 16px 16px 96px; }

/* The address bar: the field of a browser's new tab. */
.nt-address { display: flex; align-items: center; gap: 8px; height: 38px; margin: 0; padding: 0 12px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-sm); background: var(--nt-control); color: var(--nt-muted); }
.nt-address:focus-within { border-color: var(--nt-ink); background: var(--nt-raised); }
.nt-address input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; color: var(--nt-ink); font-size: 14px; }
.nt-address input::placeholder { color: var(--nt-muted); }
.nt-address input:disabled { opacity: 0.6; }

/* A link to another Environment's tab: said, never opened here. */
.nt-notice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: -14px; padding: 6px 6px 6px 12px; border: 1px solid var(--lz-warning-border); border-radius: var(--lz-radius-sm); background: var(--lz-warning-bg); color: var(--lz-ink); font-size: 13px; }
.nt-notice-text { flex: 1; min-width: 12rem; }
.nt-notice-where { white-space: nowrap; }
.nt-notice-link { color: var(--lz-blue-500); font-weight: var(--lz-weight-akce); text-decoration: none; white-space: nowrap; }
.nt-notice-link:hover { text-decoration: underline; }
.nt-icon-button { display: inline-grid; width: 26px; height: 26px; flex: none; place-items: center; padding: 0; border: 0; border-radius: var(--lz-radius-sm); background: transparent; color: inherit; }
.nt-icon-button:hover { background: var(--lz-gray-100); }

.nt-section { display: grid; gap: 10px; }
.nt-title { margin: 0; color: var(--nt-muted); font-size: 13px; font-weight: var(--lz-weight-akce); }

/* The app's tools, two to a row as Codex lists its tools, with their keys. */
.nt-tools { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.nt-tool { display: flex; align-items: center; gap: 8px; height: 38px; min-width: 0; padding: 0 8px 0 10px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-sm); background: var(--nt-control); color: var(--nt-ink); font-size: 13.5px; text-align: left; }
.nt-tool:hover { border-color: var(--nt-line-strong); background: var(--nt-hover); }
.nt-tool .icon { color: var(--nt-muted); }
.nt-tool-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nt-kbd { flex: none; padding: 1px 6px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-xs); background: var(--nt-raised); color: var(--nt-muted); font-family: var(--lz-font-mono); font-size: 11px; line-height: 1.4; }

/* Přehled: the Environment's memory on top, then every tab of the
   Environment and its running Modules. */
.nto { display: grid; align-content: start; gap: 18px; }
.nto-status { margin: 0; color: var(--nt-muted); font-size: 13px; }
.nto-memory { display: grid; gap: 8px; padding: 14px 14px 12px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-md); }
.nto-memory-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.nto-memory-title { font-size: 13px; font-weight: var(--lz-weight-akce); }
.nto-memory-value { color: var(--nt-muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nto-memory-value strong { color: var(--nt-ink); font-size: 15px; font-weight: var(--lz-weight-akce); }
.nto-bar { position: relative; display: block; height: 6px; overflow: hidden; border-radius: var(--lz-radius-xs); background: var(--lz-blue-50); }
.nto-bar-fill { position: absolute; inset: 0 auto 0 0; border-radius: var(--lz-radius-xs); background: var(--lz-blue-500); transition: width 220ms ease-out; }
.nto-memory[data-tone="warn"] .nto-bar { background: #fff1d6; }
.nto-memory[data-tone="warn"] .nto-bar-fill { background: var(--lz-expressive-orange); }
.nto-memory[data-tone="bad"] .nto-bar { background: var(--lz-red-100); }
.nto-memory[data-tone="bad"] .nto-bar-fill { background: var(--lz-red-500); }
.nto-memory-parts { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--nt-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.nto-memory-hint { display: flex; align-items: flex-start; gap: 6px; margin: 2px 0 0; font-size: 12.5px; line-height: 1.45; }
.nto-memory-hint .icon { width: 14px; height: 14px; margin-top: 2px; color: var(--lz-expressive-orange); }
.nto-group { display: grid; gap: 8px; }
.nto-group-title { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--nt-muted); font-size: 13px; font-weight: var(--lz-weight-akce); }
.nto-count { color: var(--nt-faint); font-variant-numeric: tabular-nums; }
.nto-list { margin: 0; padding: 0; overflow: hidden; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-md); list-style: none; }
/* A row: what it is and who opened it on the left; the memory over the
   actions on the right. */
.nto-row { display: grid; align-items: center; gap: 2px 12px; grid-template-areas: "open mem" "open actions"; grid-template-columns: minmax(0, 1fr) auto; padding: 8px 8px 8px 10px; }
.nto-row + .nto-row { border-top: 1px solid var(--nt-line-faint); }
.nto-open { display: flex; align-items: flex-start; gap: 10px; min-width: 0; padding: 2px; border: 0; border-radius: var(--lz-radius-sm); background: transparent; color: inherit; text-align: left; grid-area: open; }
.nto-open > :first-child { margin-top: 2px; }
.nto-open:not(.is-static):hover .nto-name { text-decoration: underline; }
.nto-open.is-static { cursor: default; }
.nto-text { display: grid; gap: 2px; min-width: 0; }
.nto-name { overflow: hidden; color: var(--nt-ink); font-size: 13.5px; text-overflow: ellipsis; white-space: nowrap; }
.nto-meta { display: flex; flex-wrap: wrap; gap: 0 10px; min-width: 0; color: var(--nt-muted); font-size: 12px; }
.nto-who { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.nto-who .icon { width: 12px; height: 12px; }
.nto-status-working { color: var(--lz-blue-500); }
.nto-here { padding: 0 5px; border-radius: var(--lz-radius-xs); background: var(--nt-selected); color: var(--nt-ink); }
.nto-mem { color: var(--nt-ink); font-size: 12.5px; font-variant-numeric: tabular-nums; grid-area: mem; justify-self: end; white-space: nowrap; }
.nto-mem.is-heavy { font-weight: 650; }
.nto-actions { display: flex; justify-content: flex-end; gap: 4px; grid-area: actions; }
.nto-action { height: 24px; padding: 0 8px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-sm); background: var(--nt-raised); color: var(--nt-ink); font-size: 12px; font-weight: var(--lz-weight-akce); }
.nto-action:hover:not(:disabled) { border-color: var(--nt-line-strong); background: var(--nt-hover); }
.nto-action:disabled { color: var(--nt-faint); cursor: default; opacity: 0.6; }
.nto-empty { margin: 0; padding: 12px 14px; border: 1px dashed var(--nt-line); border-radius: var(--lz-radius-md); color: var(--nt-muted); font-size: 13px; }

/* A tab's icon: its favicon or a globe, with a dot while an agent works. */
.nt-favicon { position: relative; display: inline-grid; flex: none; width: 16px; height: 16px; place-items: center; color: var(--nt-muted); }
.nt-favicon img { display: block; width: 16px; height: 16px; border-radius: var(--lz-radius-xs); }
.nt-favicon .icon { width: 15px; height: 15px; }
.nt-agent { position: absolute; right: -4px; bottom: -4px; width: 10px; height: 10px; border: 2px solid var(--nt-surface); border-radius: 50%; background: var(--lz-blue-500); animation: nt-agent 1.6s ease-in-out infinite; }
@keyframes nt-agent { 50% { box-shadow: 0 0 0 3px rgba(13, 18, 219, 0.22); } }
.nt-stone { display: block; flex: none; border-radius: var(--lz-radius-xs); }

/* Navrhované: the Environment's apps. */
.nt-group { display: grid; gap: 4px; }
.nt-caption { margin: 0; color: var(--nt-faint); font-size: 12px; font-weight: 500; }
.nt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.nt-tile { display: grid; justify-items: center; gap: 8px; min-width: 0; padding: 14px 6px 12px; border: 1px solid transparent; border-radius: var(--lz-radius-sm); background: transparent; color: var(--nt-ink); font-size: 13px; }
.nt-tile:hover { border-color: var(--nt-line); background: var(--nt-control); }
.nt-tile-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* On a Team Environment only: the whole Team sees the sign-ins made here
   (Matěj 2026-10-12 dropped the note elsewhere). */
.nt-note { display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 12px; border-radius: var(--lz-radius-sm); background: var(--lz-blue-100); color: var(--lz-ink); font-size: 13.5px; }

/* The toast: why a closed tab ends and Vrátit for its grace; a later
   message shows above that line and never takes Vrátit away. */
.nt-toast-region { position: fixed; z-index: 6; right: 16px; bottom: 18px; left: 16px; display: grid; justify-items: center; pointer-events: none; }
.nt-toast { display: flex; align-items: center; gap: 10px; max-width: 100%; padding: 8px 8px 8px 16px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-md); background: var(--nt-overlay); color: var(--nt-overlay-ink); box-shadow: var(--lz-shadow-float); font-size: 13.5px; pointer-events: auto; }
.nt-toast:not(:has(button)) { padding-right: 16px; }
.nt-toast-note { display: block; color: var(--nt-muted); }
.nt-toast-undo { flex: none; margin-left: 4px; padding: 5px 10px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-sm); background: var(--nt-raised); color: var(--nt-ink); font-weight: var(--lz-weight-akce); }
.nt-toast-undo:hover { background: var(--nt-hover); }

/* The warning before closing a tab an agent works in. */
.nt-scrim { position: fixed; z-index: 8; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(9, 9, 9, 0.28); }
.nt-confirm { display: grid; gap: 10px; width: min(380px, 100%); padding: 18px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-md); background: var(--nt-overlay); color: var(--nt-overlay-ink); box-shadow: var(--lz-shadow-float); }
.nt-confirm-title { font-size: 15px; font-weight: var(--lz-weight-akce); }
.nt-confirm-text { margin: 0; color: var(--nt-muted); font-size: 13.5px; line-height: 1.5; }
.nt-confirm-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.nt-button { height: 32px; padding: 0 12px; border: 1px solid var(--nt-line); border-radius: var(--lz-radius-sm); background: var(--nt-raised); color: var(--nt-ink); font-size: 13px; font-weight: var(--lz-weight-akce); }
.nt-button:hover { background: var(--nt-hover); }
.nt-button.is-danger { border-color: var(--lz-danger-border); background: var(--lz-danger-bg); color: var(--lz-danger); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
