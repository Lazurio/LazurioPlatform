name: Platform checks

# Probe for #240 (do not merge): the unchanged suite under `bun test
# --parallel`, six identical runs on the pinned Bun 1.4.2 and six on Bun
# canary, which carries oven-sh/bun#44581 (the spawnSync fix for
# oven-sh/bun#34069).
on:
  pull_request:

permissions:
  contents: read

jobs:
  repeat:
    name: probe ${{ matrix.bun }} ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        bun: [1.4.2, canary]
        run: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun --revision
      - run: bun install --frozen-lockfile
      - run: bun test --parallel --timeout=20000
