name: Platform checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  concurrent:
    name: four serial shards in one job ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: |
          start=$(date +%s)
          for s in 1 2 3 4; do bun test --timeout=20000 --shard=$s/4 > "shard$s.log" 2>&1 & pids[$s]=$!; done
          status=0
          for s in 1 2 3 4; do wait "${pids[$s]}" || status=1; done
          for s in 1 2 3 4; do echo "== shard $s"; grep -E '\(fail\)|dangling|timed out|Ran [0-9]+ tests| fail$' "shard$s.log"; done
          echo "wall $(( $(date +%s) - start ))s"
          exit $status
