name: Platform checks

# Probe for #240 (do not merge): the final test command of the pull request,
# `bun test --parallel=4 --timeout=20000`, six identical runs with the
# recorded per-file timings and six without, on the pinned Bun 1.4.2.
on:
  pull_request:

permissions:
  contents: read

jobs:
  repeat:
    name: probe ${{ matrix.timings }} ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        timings: [timings, plain]
        run: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - if: matrix.timings == 'timings'
        run: bun test --parallel=4 --timings=tests/timings.json --timeout=20000
      - if: matrix.timings == 'plain'
        run: bun test --parallel=4 --timeout=20000
