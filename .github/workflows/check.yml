name: Platform checks

# Probe for #240 (do not merge): the suite with asynchronous test children
# under `bun test --parallel` on the pinned Bun 1.4.2, six identical runs with
# four workers and one each with 3, 5 and 6 workers. Each run prints its
# per-file durations.
on:
  pull_request:

permissions:
  contents: read

jobs:
  repeat:
    name: probe ${{ matrix.workers }} workers ${{ matrix.run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workers: 4, run: 1 }
          - { workers: 4, run: 2 }
          - { workers: 4, run: 3 }
          - { workers: 4, run: 4 }
          - { workers: 4, run: 5 }
          - { workers: 4, run: 6 }
          - { workers: 3, run: 1 }
          - { workers: 5, run: 1 }
          - { workers: 6, run: 1 }
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test --parallel=${{ matrix.workers }} --timings=timings.json --update-timings
      - if: always()
        run: cat timings.json
