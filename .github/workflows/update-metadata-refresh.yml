name: Update metadata refresh

# Keeps the published update repository fresh (docs/update.md "Publishing",
# docs/release-keys.md "Expiry calendar"). A lapsed timestamp would stop every
# Machine from updating, so snapshot and timestamp are renewed long before
# they expire: the timestamp (7 days) when fewer than 5 days remain, the
# snapshot (30 days) when fewer than 20 remain.
#
# This job holds ONLY the snapshot and timestamp keys. It cannot renew targets
# (protected `release` environment) or the root (offline). When either of
# those drops below its margin the job FAILS with a summary that says what a
# person has to do — silence here would become an outage weeks later.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # `bash -eo pipefail`: a failing command in a pipeline fails the step.
    shell: bash

jobs:
  refresh:
    name: Renew snapshot and timestamp, watch every role
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only the repository whose Pages origin is compiled into the product.
    if: github.repository == 'Lazurio/LazurioPlatform'
    # No concurrency group (see release.yml): a race with a release job is
    # decided by the never-forced push; tomorrow's run is still days early.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check out the published tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/update-tree.sh checkout "$RUNNER_TEMP/tree"
          if [ -f release/root.json ] && [ -f "$RUNNER_TEMP/tree/metadata/timestamp.json" ]; then
            echo "published=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing is published yet (no release/root.json or no tree); nothing to refresh."
            echo "published=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Renew what is below its margin
        if: steps.tree.outputs.published == 'true'
        env:
          LAZURIO_TUF_SNAPSHOT_KEY: ${{ secrets.LAZURIO_TUF_SNAPSHOT_KEY }}
          LAZURIO_TUF_TIMESTAMP_KEY: ${{ secrets.LAZURIO_TUF_TIMESTAMP_KEY }}
        run: |
          bun run scripts/release-publish.ts refresh --when-low \
            --tree "$RUNNER_TEMP/tree" --root release/root.json
      # Freshness first: a missing release asset must not also let the
      # timestamp lapse for everybody. Re-signing changes no target.
      - name: Deploy the tree in one commit
        id: deploy
        if: steps.tree.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The gate before every deployment: held against what is published
          # (the checked-out commit) with the CLIENT's floor-vector rules. A tree
          # installed Machines would refuse as metadata-rollback is never pushed.
          scripts/update-tree.sh baseline "$RUNNER_TEMP/tree" "$RUNNER_TEMP/published"
          bun run scripts/release-publish.ts status --rollback-only \
            --tree "$RUNNER_TEMP/tree" --against "$RUNNER_TEMP/published"
          domain="$(bun run scripts/release-publish.ts pages-domain)"
          UPDATE_TREE_CNAME="$domain" scripts/update-tree.sh push "$RUNNER_TEMP/tree" "Refresh update metadata"
      - name: Wait until the published origin serves it
        if: steps.deploy.outputs.changed == 'true'
        run: bun run scripts/release-publish.ts await-deployment --tree "$RUNNER_TEMP/tree"
      - name: Every selected artifact is still downloadable
        if: ${{ !cancelled() && steps.tree.outputs.published == 'true' }}
        run: bun run scripts/release-publish.ts verify --tree "$RUNNER_TEMP/tree"
      - name: Validity of every role (fails below a margin)
        if: ${{ !cancelled() && steps.tree.outputs.published == 'true' }}
        run: |
          {
            echo "## Update metadata validity"
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          bun run scripts/release-publish.ts status --tree "$RUNNER_TEMP/tree" | tee -a "$GITHUB_STEP_SUMMARY"
