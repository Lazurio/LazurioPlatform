name: Qualify

# The qualification of a release candidate (docs/release-cycle.md
# "Qualification and the canary"):
#
#   Release publishes vX.Y.Z-rc.N -> for every qualified target, a disposable
#   runner per journey downloads THAT tag's published assets, verifies them
#   and runs one of J1-J6 -> one evidence line each (lazurio.qualification.v1)
#   -> the artifact qualification-<tag>, which the release job of the final
#   tag vX.Y.Z requires.
#
# A workflow of its own, started by the Release run (workflow_run), not a job
# of release.yml: release.yml is the trust entry point of every installed
# client and stays the publishing path only; a qualification can be run again
# by hand (workflow_dispatch) without touching a release; and it needs no
# right beyond reading. workflow_run always runs THIS file from the default
# branch; the journeys themselves are the candidate's, checked out at its tag.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release candidate tag (vX.Y.Z-rc.N)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    # `bash -eo pipefail`: a failing command in a pipeline fails the step.
    shell: bash

env:
  BUN_VERSION: 1.4.2

jobs:
  resolve:
    name: Resolve the candidate
    if: >-
      github.repository == 'Lazurio/LazurioPlatform' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      # The tag travels as data through the environment, never into a script.
      REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - id: resolve
        run: |
          pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$'
          if ! [[ "$REQUESTED" =~ $pattern ]]; then
            # The Release run of a final tag: there is no candidate to qualify.
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              echo "::error::Not a release candidate tag: expected vX.Y.Z-rc.N"
              exit 1
            fi
            echo "Not a release candidate; nothing to qualify."
            exit 0
          fi
          # Only what the release workflow published is a candidate.
          state=$(gh release view "$REQUESTED" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')
          if [[ "$state" != "false true" ]]; then
            echo "::error::$REQUESTED is not a published prerelease"
            exit 1
          fi
          echo "tag=$REQUESTED" >> "$GITHUB_OUTPUT"

  journey:
    name: ${{ matrix.journey }} on ${{ matrix.platform.runner }}
    needs: resolve
    if: needs.resolve.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        # A fresh VM per journey: nothing one journey leaves reaches another.
        platform:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-14
            target: darwin-arm64
        journey: [J1, J2, J3, J4, J5, J6]
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
      TARGET: ${{ matrix.platform.target }}
      RUNNER_LABEL: ${{ matrix.platform.runner }}
      JOURNEY: ${{ matrix.journey }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: The candidate's published assets, verified
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/candidate" \
            --pattern manifest.json --pattern lazurio.sigstore.json --pattern install.sh \
            --pattern "lazurio-$TARGET"
          # Digest, attestation at the tag, and this checkout is its source.
          LAZURIO_QUALIFY_DISPOSABLE=1 bun run scripts/qualify/journeys.ts verify "$RUNNER_TEMP/candidate"
      - name: A systemd user manager that outlives the session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime=/run/user/$(id -u)
          for _ in $(seq 1 60); do [[ -S "$runtime/bus" ]] && break; sleep 0.5; done
          {
            echo "XDG_RUNTIME_DIR=$runtime"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus"
          } >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR=$runtime systemctl --user is-system-running --wait || true
      - name: Journey ${{ matrix.journey }}
        env:
          LAZURIO_QUALIFY_DISPOSABLE: "1"
        run: |
          if [[ "$JOURNEY" == J6 ]]; then
            # A kill after each activation step needs a hook no release
            # executable has: the candidate's own suite at its verified commit.
            proof=source
            command=(bun test tests/update-kill.test.ts)
          else
            proof=executable
            command=(bun run scripts/qualify/journeys.ts "$JOURNEY" "$RUNNER_TEMP/candidate")
          fi
          mkdir -p "$RUNNER_TEMP/evidence"
          bun run scripts/qualify/evidence.ts run --candidate "$RUNNER_TEMP/candidate" \
            --target "$TARGET" --runner "$RUNNER_LABEL" --journey "$JOURNEY" --proof "$proof" \
            --out "$RUNNER_TEMP/evidence/$TARGET-$JOURNEY.jsonl" -- "${command[@]}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ env.TAG }}-${{ matrix.platform.target }}-${{ matrix.journey }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  evidence:
    name: Qualification evidence
    needs: [resolve, journey]
    if: always() && needs.resolve.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/evidence
          pattern: qualification-${{ env.TAG }}-*
          merge-multiple: true
      - name: One evidence file
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/evidence/*.jsonl)
          cat "${files[@]}" /dev/null > "$RUNNER_TEMP/qualification.jsonl"
          cat "$RUNNER_TEMP/qualification.jsonl"
      # Kept also when a journey failed: the record of what failed. The release
      # job accepts it only from a successful run, and checks it again.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-${{ env.TAG }}
          path: ${{ runner.temp }}/qualification.jsonl
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Every journey ok on every target, for the published bytes
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" \
            --pattern manifest.json
          bun run scripts/qualify/evidence.ts check --manifest "$RUNNER_TEMP/release/manifest.json" \
            "$RUNNER_TEMP/qualification.jsonl"
