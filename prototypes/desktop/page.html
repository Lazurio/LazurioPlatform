<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Plocha Prostředí</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --bar: #ffffff;
    --text: #15171a;
    --muted: #5c6370;
    --line: #d9dce1;
    --accent: #1f5fd6;
    --accent-text: #ffffff;
    --warn-bg: #fff4d6;
    --warn-text: #5a4200;
    --ok-bg: #e3f3e6;
    --ok-text: #1d5a2c;
    --screen: #2b2d31;
    --focus: #ffb020;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151618;
      --bar: #1e2023;
      --text: #eceef1;
      --muted: #a3a9b3;
      --line: #33363b;
      --accent: #5b8ff0;
      --accent-text: #0d1117;
      --warn-bg: #3d3110;
      --warn-text: #ffe3a3;
      --ok-bg: #173320;
      --ok-text: #b9e8c4;
      --screen: #0e0f10;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151618; --bar: #1e2023; --text: #eceef1; --muted: #a3a9b3; --line: #33363b;
    --accent: #5b8ff0; --accent-text: #0d1117; --warn-bg: #3d3110; --warn-text: #ffe3a3;
    --ok-bg: #173320; --ok-text: #b9e8c4; --screen: #0e0f10;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px max(16px, env(safe-area-inset-left)); background: var(--bar);
    border-bottom: 1px solid var(--line);
  }
  .name { font-weight: 600; margin-right: 4px; white-space: nowrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    background: var(--bg); color: var(--muted); white-space: nowrap; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis;
  }
  .chip[data-state="you"] { background: var(--ok-bg); color: var(--ok-text); }
  .chip[data-state="agent"], .chip[data-state="other"] { background: var(--warn-bg); color: var(--warn-text); }
  .spacer { flex: 1; }
  button {
    font: inherit; min-height: 32px; padding: 4px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bar); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button[hidden] { display: none; }
  @media (hover: hover) { button:hover { filter: brightness(0.96); } }
  .notice {
    padding: 8px max(16px, env(safe-area-inset-left)); background: var(--warn-bg); color: var(--warn-text);
    border-bottom: 1px solid var(--line);
  }
  .notice[hidden] { display: none; }
  .escapes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  main { position: relative; flex: 1; min-height: 0; background: var(--screen); }
  #screen { position: absolute; inset: 0; }
  #mark {
    position: absolute; pointer-events: none; border: 3px solid var(--focus); border-radius: 4px;
    box-shadow: 0 0 0 9999px rgb(0 0 0 / 0.25); transition: opacity 400ms ease-out; opacity: 0;
  }
  @media (prefers-reduced-motion: reduce) { #mark { transition: none; } }
  #status { position: absolute; inset: auto 16px 16px 16px; color: #fff; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<header>
  <span class="name">Plocha Prostředí</span>
  <span class="chip" id="turn" data-state="watch">Připojuji…</span>
  <button class="primary" id="take" type="button" hidden>Ovládat plochu</button>
  <button id="release" type="button" hidden>Pustit plochu</button>
  <span class="spacer"></span>
  <button id="fit" type="button" aria-pressed="true">Celá plocha</button>
  <button id="back" type="button" hidden>Zpět na záložku</button>
</header>
<div class="notice" id="others" hidden>
  Na ploše jsou okna i dalších vláken tohoto Prostředí. Pracujte jen s oknem své záložky; ostatní okna nezavírejte.
</div>
<div class="notice escapes" id="escapes" hidden></div>
<main>
  <div id="screen"></div>
  <div id="mark"></div>
  <div id="status"></div>
</main>
<script type="module" src="/page.js"></script>
</body>
</html>
